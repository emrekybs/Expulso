[arac: Sherloq]
kaynak = git https://github.com/GuidoBartoli/sherloq
kategori = OSINT Image
komut = sherloq
calistir = sherloq.py
calistirici = python
klasorde = evet
kurulum = python3 -m venv .uvtool && .uvtool/bin/pip install -q uv && export UV_PYTHON_INSTALL_DIR="$PWD/.uv-python" && .uvtool/bin/uv venv --managed-python --python 3.11 .venv && .uvtool/bin/uv pip install --python .venv/bin/python -r gui/requirements.txt
paketler = libxcb-cursor0 libegl1 perl
parametre = 
simge = depo:gui/icons/sherloq_alpha.png

[arac: GeoCLIP]
kaynak = git https://github.com/VicenteVivan/geo-clip
kategori = Geolocation
komut = geoclip
calistir = geoclip_predict.py
calistirici = python
klasorde = evet
kurulum = printf '%s\n' 'import sys' 'from geoclip import GeoCLIP' 'if len(sys.argv) < 2 or sys.argv[1] in ("-h", "--help"):' '    print("usage: geoclip IMAGE [TOP_K]  - predict GPS coordinates of a photo (GeoCLIP)"); sys.exit(0)' 'k = int(sys.argv[2]) if len(sys.argv) > 2 else 5' 'gps, prob = GeoCLIP().predict(sys.argv[1], top_k=k)' 'for i in range(k): print(f"{i+1}: {gps[i][0]:.6f}, {gps[i][1]:.6f}  p={prob[i]:.4f}  https://www.google.com/maps?q={gps[i][0]},{gps[i][1]}")' > geoclip_predict.py
parametre = --help
simge = otomatik
not = İlk kullanımda ~1.7 GB model indirir

