[arac: No-Infoga]
kaynak = git https://github.com/akashblackhat/no-infoga.py
kategori = OSINT phone number
komut = no-infoga
calistir = no-infoga.py
kurulum = [ -x .venv/bin/python ] || python3 -m venv --system-site-packages .venv; .venv/bin/pip install phonenumbers opencage && sed -i 's/^#from opencage/from opencage/; s/^#from phonenumbers/from phonenumbers/' no-infoga.py
parametre =
not = Eski bir araç; OpenCage servisine bağlı ve sonuç vermeyebilir
simge = rozet
eski = no-infoga.desktop

