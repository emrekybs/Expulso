kategori = OSINT Dark Web
ek_kategori = OPSEC
komut = torbrowser-launcher
parametre =
terminal = hayır
simge = torbrowser
zorla = evet

[arac: ExifTool]
kaynak = apt libimage-exiftool-perl
kategori = OSINT Image
komut = exiftool
parametre =
simge = osint-resim

[arac: Kismet]
kaynak = apt kismet
kategori = Wi-Fi & Bluetooth
komut = kismet
parametre =
ac = http://localhost:2501
simge = otomatik
not = Kablosuz kartı dinlemek için 'sudo kismet' ile çalıştırın; arayüz http://localhost:2501

[arac: Airodump-ng]
