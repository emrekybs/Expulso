[arac: Orodruin]
kaynak = git https://github.com/Dev-next-gen/orodruin
kategori = Live Platforms
ek_kategori = Frameworks
komut = orodruin
calistir = orodruin-start.sh
calistirici = bash
klasorde = evet
kurulum = (cd backend && python3 -m venv .venv && .venv/bin/pip install -r requirements.txt && (test -f .env || cp .env.example .env) && (grep -q '^DATABASE_URL=' .env || echo 'DATABASE_URL=postgresql+psycopg://osint:osint@localhost:5432/osint' >> .env)) && (cd frontend && npm install) && printf '#!/bin/bash\ncd "$(dirname "$(readlink -f "$0")")"\nbash run_api.sh &\nAPI=$!\ntrap "kill $API 2>/dev/null" EXIT\nbash run_web.sh\n' > orodruin-start.sh && chmod 755 orodruin-start.sh && systemctl enable --now postgresql && su postgres -c "psql -tAc \"SELECT 1 FROM pg_roles WHERE rolname='osint'\" | grep -q 1 || psql -c \"CREATE USER osint WITH PASSWORD 'osint'\"" && su postgres -c "psql -tAc \"SELECT 1 FROM pg_database WHERE datname='osint'\" | grep -q 1 || createdb -O osint osint"
paketler = postgresql nodejs npm
parametre = 
ac = http://localhost:5174
simge = depo:frontend/public/favicon.svg

