[arac: Mosint]
kaynak = git https://github.com/alpkeskin/mosint
kategori = OSINT email
komut = mosint
calistir = mosint-run.sh
calistirici = bash
klasorde = evet
kurulum = cd v3 && go build -o ../mosint ./cmd/mosint && cd .. && printf '#!/bin/bash\nD="$(dirname "$(readlink -f "$0")")"\n[ -f "$HOME/.mosint.yaml" ] || cp "$D/example-config.yaml" "$HOME/.mosint.yaml"\nexec "$D/mosint" "$@"\n' > mosint-run.sh && chmod 755 mosint-run.sh
paketler = golang-go
parametre = -h
simge = depo:static/mosint-logo.png

