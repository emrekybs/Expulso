[arac: Threat Intel Nom Nom]
kaynak = git https://github.com/LuemmelSec/Threat-Intel-Nom-Nom
kategori = OSINT Threat Intel
komut = threat-intel-nom-nom
calistir = start.sh
calistirici = bash
klasorde = evet
kurulum = [ -f .env ] || { cp .env.example .env; P=$(openssl rand -hex 12); K=$(openssl rand -hex 32); sed -i "s/darkweb_password_change_me/$P/g; s/your-super-secret-key-change-this-in-production/$K/" .env; } ; printf '#!/bin/bash\ncd "$(dirname "$(readlink -f "$0")")" || exit 1\nif docker compose version >/dev/null 2>&1; then DC="docker compose"; else DC=docker-compose; fi\nif ! docker info >/dev/null 2>&1; then DC="pkexec $DC"; fi\n$DC up -d --build && echo "Durdurmak için: $DC down"\n' > start.sh && chmod 755 start.sh
paketler = docker.io docker-compose openssl
parametre = 
ac = http://localhost:3000
simge = otomatik
not = Docker ile çalışır; ilk açılış birkaç dakika sürer

